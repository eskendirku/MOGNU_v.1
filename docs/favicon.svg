<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Indigo Tile Background -->
  <rect width="64" height="64" rx="14" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="13" fill="none" stroke="#4338ca" stroke-width="1" opacity="0.6"/>

  <!-- Target Overshoot Zone Pulse (Zone TR_H) -->
  <rect x="13" y="4" width="14" height="10" rx="3" fill="#10b981" opacity="0.25"/>

  <!-- Continuous dynamic stroke with kinematic curve -->
  <path d="M 20,44 L 20,9 Q 20,6 23,8 L 56,41 Q 58,43 55,44 L 20,44 L 44,20"
        fill="none"
        stroke="url(#neonGreen)"
        stroke-width="3.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- 9 Dots Grid -->
  <g fill="#f8fafc">
    <circle cx="20" cy="20" r="2.8"/>
    <circle cx="32" cy="20" r="2.8"/>
    <circle cx="44" cy="20" r="2.8"/>

    <circle cx="20" cy="32" r="2.8"/>
    <circle cx="32" cy="32" r="3.2" fill="#a855f7"/>
    <circle cx="44" cy="32" r="2.8"/>

    <circle cx="20" cy="44" r="2.8"/>
    <circle cx="32" cy="44" r="2.8"/>
    <circle cx="44" cy="44" r="2.8"/>
  </g>
</svg>